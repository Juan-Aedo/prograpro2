services:
  postgres:
    image: postgres:16-alpine
    container_name: panoramas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: panoramas
      POSTGRES_PASSWORD: panoramas
      POSTGRES_DB: panoramas
    ports:
      - "5432:5432"
    volumes:
      - panoramas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panoramas -d panoramas"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: panoramas-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://panoramas:panoramas@postgres:5432/panoramas
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}

volumes:
  panoramas_pgdata:
