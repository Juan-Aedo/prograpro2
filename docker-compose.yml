services:
  postgres:
    image: postgres:16-alpine
    container_name: panoramas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: panoramas
      POSTGRES_PASSWORD: panoramas
      POSTGRES_DB: panoramas
    ports:
      - "5432:5432"
    volumes:
      - panoramas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panoramas -d panoramas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  panoramas_pgdata:
